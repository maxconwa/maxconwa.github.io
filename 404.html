<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Max Conway</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/img/favicon-32.png" sizes="32x32" type="image/png">
<style>
  :root { --bg:#fdfdfc; --fg:#16181d; --muted:#5b6270; --accent:#2f5fd0; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#101216; --fg:#e9eaee; --muted:#99a0ac; --accent:#8db0ff; }
  }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100vh; display:grid; place-content:center; text-align:center;
    padding:2rem; background:var(--bg); color:var(--fg);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
                 "Helvetica Neue", Arial, sans-serif;
    font-size:17px; line-height:1.65; -webkit-font-smoothing:antialiased;
  }
  h1 { font-size:clamp(2rem,5vw,2.75rem); letter-spacing:-.028em; margin:0 0 .5rem; }
  p { color:var(--muted); margin:0 0 1.75rem; max-width:44ch; }
  a { color:var(--bg); background:var(--fg); text-decoration:none; font-weight:600;
      padding:.6rem 1.15rem; border-radius:7px; display:inline-block; font-size:.95rem; }
  a:hover { opacity:.87; }
</style>
</head>
<body>
  <h1>Page not found</h1>
  <p>That link doesn&rsquo;t point anywhere on this site.</p>
  <a href="/">Back to the homepage</a>
</body>
</html>
